name: CI

on:
  # 0) 手动触发
  workflow_dispatch:

  # 1) 任意修改 backend 或 frontend 的 PR
  pull_request:
    paths:
      - "backend/**"
      - "frontend/**"

  # 2) push 到 main 分支且改动 backend 或 frontend
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - "frontend/**"

jobs:
  # ------------------------
  # Backend unit/API tests
  # ------------------------
  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci

      - name: Run backend unit tests
        run: npm run test:unit

      - name: Run backend API tests
        run: npm run test:api

  # ------------------------
  # Frontend unit tests (Vitest)
  # ------------------------
  frontend-unit-tests:
    runs-on: ubuntu-latest
    needs: backend-tests
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend unit tests (Vitest)
        run: npm run test:unit:run

  # ------------------------
  # Frontend UI (Playwright) tests
  # ------------------------
  frontend-ui-tests:
    runs-on: ubuntu-latest
    needs: frontend-unit-tests

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Install backend deps
      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      # 启动 backend (3000) 在后台，并等待就绪
      - name: Start backend server
        working-directory: backend
        run: |
          npm run dev &
          npx wait-on http://127.0.0.1:3000

      # Install frontend deps
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      # 安装 Playwright 浏览器
      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps

      # 跑 UI 测试（会按 playwright.config.ts 自动起 Vite）
      - name: Run Playwright UI tests
        working-directory: frontend
        run: npm run test:ui
