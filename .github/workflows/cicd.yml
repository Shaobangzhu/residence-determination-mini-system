name: CI/CD

on:
  # 0) Manual trigger
  workflow_dispatch:

  # 1) Any PR that modifies backend or frontend
  pull_request:
    paths:
      - "backend/**"
      - "frontend/**"

  # 2) Push to main that modifies backend or frontend (CD will trigger)
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - "frontend/**"

jobs:
  # ------------------------
  # Backend unit + API tests
  # ------------------------
  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci

      - name: Run backend unit tests
        run: npm run test:unit

      - name: Run backend API tests
        run: npm run test:api

  # ------------------------
  # Frontend unit tests (Vitest)
  # ------------------------
  frontend-unit-tests:
    runs-on: ubuntu-latest
    needs: backend-tests
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend unit tests (Vitest)
        run: npm run test:unit:run

  # ------------------------
  # Frontend UI tests (Playwright)
  # ------------------------
  frontend-ui-tests:
    runs-on: ubuntu-latest
    needs: frontend-unit-tests

    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Install backend deps
      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      # Start backend (port 3000) in background and wait for readiness
      - name: Start backend server
        working-directory: backend
        run: |
          npm run dev &
          sleep 5
          echo "=== curl / ==="
          curl -i http://127.0.0.1:3000/ || true
          echo "=== curl /api/health ==="
          curl -i http://127.0.0.1:3000/api/health || true
          npx wait-on tcp:3000
        timeout-minutes: 2

      # Install frontend deps
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      # Install required Playwright browsers
      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps

      # Run Playwright UI tests (Playwright starts Vite dev server automatically)
      - name: Run Playwright UI tests
        working-directory: frontend
        run: npm run test:ui

  # ------------------------
  # Deploy backend to Render
  # ------------------------
  deploy-backend:
    runs-on: ubuntu-latest
    needs: frontend-ui-tests
    # Only deploy on main push (not for PRs)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Trigger Render backend deploy hook
        run: |
          curl -X POST "$RENDER_BACKEND_DEPLOY_HOOK_URL"
        env:
          RENDER_BACKEND_DEPLOY_HOOK_URL: ${{ secrets.RENDER_BACKEND_DEPLOY_HOOK_URL }}

  # ------------------------
  # Deploy frontend to Vercel
  # ------------------------
  deploy-frontend:
    runs-on: ubuntu-latest
    needs: frontend-ui-tests
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      # Pull Vercel project config including production environment variables
      - name: Pull Vercel environment
        # REMOVED: working-directory: frontend, # Not needed as vercel pull creates/verifies .vercel in cwd
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          vercel pull --yes --environment=production --token=$VERCEL_TOKEN

      # Build frontend with Vercel (prebuild bundle)
      - name: Build frontend with Vercel (debug)
        # working-directory: frontend
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          vercel build --prod --token=$VERCEL_TOKEN --debug

      # Deploy the prebuilt frontend to production
      - name: Deploy frontend to Vercel
        # working-directory: frontend
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          vercel deploy --prebuilt --prod --yes --token=$VERCEL_TOKEN
